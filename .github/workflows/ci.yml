name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  mod:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          rustup toolchain install stable --profile minimal \
            --component clippy,rustfmt --target wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      # The content tests: the registration, built natively, checked before it
      # ever reaches wasm.
      - run: cargo nextest run
      - run: tools/package.sh
      # The real host, not a stand-in: load the packaged guest, run its
      # registration, and fail the build if the engine would reject it.
      - name: Install modload
        run: cargo install --git https://github.com/AestroFidelium/stormlight-shared.git stormlight_modloader --bin modload
      - run: modload dist/example
